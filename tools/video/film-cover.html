<!doctype html>
<!-- Capa do Reels, renderizada por film-cover.js em 1080x1920.

     Reproduz o topo da /growth no recorte 9:16 que o usuario mandou como
     modelo: as posicoes abaixo sao as medidas daquele recorte, escaladas para
     1080x1920, e fontes, cores e espacamentos sao os do CSS da pagina. Muda
     o cargo, a pedido dele: Solutions & Growth, e nao Growth & Branding. E
     as duas palavras do rotulo ficam centradas uma sobre a outra.

     O bloco vai de y=159 a y=1658 — 1499 px, mais que os 1440 do recorte
     3:4 do grid do perfil. No recorte padrao (o miolo) o grid perde o topo
     do logo; o modelo foi escolhido assim, com o logo no alto. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:"Cormorant Garamond";font-weight:700;font-display:block;
    src:url(/fonts/cormorant-garamond-latin-700-normal.woff2) format("woff2")}
  @font-face{font-family:"Inter";font-weight:400;font-display:block;
    src:url(/fonts/inter-latin-400-normal.woff2) format("woff2")}
  :root{
    --bg:#09090b; --muted:#8b8576; --gold:#c9a24b; --gold-2:#ead29a; --gold-deep:#9c7c2e;
    --serif:"Cormorant Garamond",Georgia,serif; --sans:"Inter",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg)}
  #c{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);
     font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased;text-align:center}
  /* o brilho de cima do .hero-glow da pagina. O de baixo fica de fora: no
     site ele mora no pe do topo, abaixo dos botoes, fora do recorte que
     serviu de modelo — aqui ele acendia um brilho que o modelo nao tem */
  #glow{position:absolute;inset:0;background:
    radial-gradient(60% 50% at 50% 0%,rgba(201,162,75,.14),transparent 60%)}
  .ab{position:absolute;left:0;right:0}
  /* a srchz-mark.png tem 720 px, mas o desenho ocupa 496 a partir de x=107,
     y=20; o resto e margem transparente. Com 951 px de imagem o desenho fica
     com os 655 de largura do modelo, e o topo dele cai em y=159 */
  #mark{position:absolute;left:50%;top:133px;width:951px;transform:translateX(-50%)}
  /* .hero-kicker: Inter 400, caixa-alta, .45em, cinza */
  #kick{top:892px;font-size:40px;line-height:67px;letter-spacing:.45em;
        text-transform:uppercase;color:var(--muted)}
  /* a Inter nao tem a flor de lis; no celular ela vem de uma fonte do
     sistema e sai vazada e fina. A da FreeSerif e assim; a da DejaVu, que
     seria a escolha automatica aqui, e cheia */
  .fl{font-family:"FreeSerif",serif;letter-spacing:0;font-size:1.02em}
  /* No site cada flor ocupa lugar na propria linha: empurra HIGH-PERFORMANCE
     para a direita e ECOSYSTEMS para a esquerda, e as palavras deixam de
     ficar uma sobre a outra. Aqui a flor fica pendurada para fora da
     palavra: a margem negativa do tamanho dela tira a flor da conta da
     centralizacao, e a linha continua na base certa por ser texto corrido. */
  .hang{white-space:nowrap}
  /* o espacamento depois da ultima letra conta na largura da palavra; sem
     tirar ele, a palavra centra deslocada e a flor de baixo fica 18 px mais
     longe que a de cima */
  .wd{margin-right:-.45em}
  /* .hero-name + .gold-text: um gradiente so para as duas linhas, como no
     site — por isso o CORDEIRO sai mais fundo que o RAFAEL */
  #name{top:1079px;font-family:var(--serif);font-weight:700;font-size:183px;line-height:183px;
        letter-spacing:.04em;padding-left:.04em;
        background:linear-gradient(180deg,var(--gold-2) 0%,var(--gold) 52%,var(--gold-deep) 100%);
        -webkit-background-clip:text;background-clip:text;color:transparent}
  /* .hero-title: Inter 400, caixa-alta, .42em, dourado claro */
  #role{top:1518px;font-size:49.5px;line-height:81px;letter-spacing:.42em;padding-left:.42em;
        text-transform:uppercase;color:var(--gold-2)}
</style>
</head>
<body>
<div id="c">
  <div id="glow"></div>
  <img id="mark" src="/brand/srchz-mark.png" alt="SrChZ Technologies">
  <p id="kick" class="ab"><span class="hang l"><span class="fl">⚜</span>&nbsp;&nbsp;</span><span class="wd">High-Performance</span><br><span class="wd">Ecosystems</span><span class="hang r">&nbsp;&nbsp;<span class="fl">⚜</span></span></p>
  <h1 id="name" class="ab">RAFAEL<br>CORDEIRO</h1>
  <p id="role" class="ab">Solutions &amp; Growth<br>Strategist</p>
</div>
<script>
  /* a largura da flor so e certa com as fontes carregadas */
  document.fonts.ready.then(() => {
    for (const h of document.querySelectorAll('.hang')) {
      const w = h.getBoundingClientRect().width;
      h.style[h.classList.contains('l') ? 'marginLeft' : 'marginRight'] = -w + 'px';
    }
    window.drawn = true;
  });
</script>
</body>
</html>
