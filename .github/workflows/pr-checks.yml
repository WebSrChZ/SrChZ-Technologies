name: PR checks

# O site vai ao ar direto do repositorio (GitHub Pages serve o que esta na
# branch). Sem este check, um merge publica HTML quebrado ou link morto sem
# ninguem perceber. Roda so na stdlib do Python + node --check: nada para
# instalar, nada para quebrar.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: HTML, JSON-LD, XML e links internos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificacao estatica do site
        run: python3 tools/check_site.py .

      - name: Sintaxe dos arquivos JavaScript
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if ! node --check "$file"; then
              echo "::error file=$file::erro de sintaxe"
              status=1
            fi
          done < <(find . -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -print0)
          exit $status

      - name: Service worker com versao de cache propria
        run: |
          # O sw.js cacheia index.html, css e js. Se a versao nao e bumpada no
          # mesmo PR que altera esses arquivos, quem ja visitou o site continua
          # vendo a versao antiga.
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^growth/(index\.html|css/|js/)'; then
            if ! git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^growth/sw\.js$'; then
              echo "::error::growth/ mudou mas growth/sw.js nao: bumpe CACHE em growth/sw.js"
              exit 1
            fi
          fi
