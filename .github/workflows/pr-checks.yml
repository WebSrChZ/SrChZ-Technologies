name: PR checks

# O site vai ao ar direto do repositorio (GitHub Pages serve o que esta na
# branch). Sem este check, um merge publica HTML quebrado ou link morto sem
# ninguem perceber. Roda so na stdlib do Python + node --check: nada para
# instalar, nada para quebrar.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: HTML, JSON-LD, XML e links internos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # O step do service worker compara com a branch base: sem o
          # historico completo, origin/<base> nao existe no runner e o
          # git diff falha silenciosamente dentro do pipe.
          fetch-depth: 0

      - name: Verificacao estatica do site
        run: python3 tools/check_site.py .

      - name: Sintaxe dos arquivos JavaScript
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if ! node --check "$file"; then
              echo "::error file=$file::erro de sintaxe"
              status=1
            fi
          done < <(find . -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -print0)
          exit $status

      - name: Traducao completa em todos os idiomas
        run: node tools/check_i18n.js .

      # O check acima le arquivos e nao alcanca a classe de defeito que mais
      # apareceu na traducao: a chave existe, o texto esta certo, e o visitante
      # mesmo assim nao consegue usar a pagina — rotulo do seletor desenhado na
      # barra de navegacao, seletor parado fora da area visivel, navegacao mais
      # larga que a tela. Isso so se ve medindo a pagina renderizada.
      #
      # playwright-core nao baixa navegador: usa o Chrome que ja vem na imagem
      # do runner, achado por tools/check_i18n_browser.js em /usr/bin.
      - name: Layout, troca de idioma e tipografia CJK no navegador
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.49.1
          node tools/check_i18n_browser.js .

      - name: Service worker com versao de cache propria
        run: |
          # O sw.js cacheia index.html, css e js. Se a versao nao e bumpada no
          # mesmo PR que altera esses arquivos, quem ja visitou o site continua
          # vendo a versao antiga.
          base="origin/${{ github.base_ref }}"
          # Falha explicita: um check que nao consegue comparar precisa gritar,
          # nao passar verde. Dentro de um pipe, o erro do git era engolido.
          git rev-parse --verify "$base" >/dev/null 2>&1 \
            || { echo "::error::$base indisponivel no runner"; exit 1; }
          changed=$(git diff --name-only "$base...HEAD")
          if echo "$changed" | grep -qE '^growth/(index\.html|css/|js/)'; then
            if ! echo "$changed" | grep -q '^growth/sw\.js$'; then
              echo "::error::growth/ mudou mas growth/sw.js nao: bumpe CACHE em growth/sw.js"
              exit 1
            fi
          fi
